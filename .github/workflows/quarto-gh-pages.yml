name: Publish Quarto site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          clean: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages and register qmcpy kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e classlib
          python -m ipykernel install --user --name qmcpy --display-name "qmcpy"

      - name: Render website
        run: quarto render

      - name: Render slides subproject
        working-directory: slides
        run: quarto render

      - name: Stage slides into website output
        run: |
          rm -rf _site/slides
          mkdir -p _site/slides
          rsync -a --delete slides/_site/ _site/slides/

      - name: Clean Quarto publish worktree
        run: |
          rm -rf .quarto/quarto-publish-worktree-*
          rm -rf _site/.git

      - name: Initialize gh-pages branch if absent
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git config user.name "Quarto GHA Workflow Runner"
            git config user.email "quarto-github-actions-publish@example.com"
            empty_tree="$(git hash-object -t tree /dev/null)"
            initial_commit="$(git commit-tree "$empty_tree" -m "Initialize gh-pages branch")"
            git branch gh-pages "$initial_commit"
            git push origin gh-pages
          fi

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
