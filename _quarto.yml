project:
  type: website
  render:
    - "*.qmd"
    - "pages/**/*.qmd"
    - "!classlib/**"
    - "!notebooks/**"
    - "!slides/**"
  resources:
    - assets/**
    - classlib/classlib/quarto/assets/**
    - classlib/classlib/quarto/css/**
    - classlib/classlib/quarto/js/**
    - classlib/classlib/quarto/slides/**
    - classlib/classlib/quarto/website/*.css
    - classlib/classlib/notebooks/**

format:
  html:
    css:
      - classlib/classlib/quarto/website/hickernell-website.css
    link-external-newwindow: true

metadata:
  instructor_photo: classlib/classlib/quarto/assets/images/fredplaidshirtcropped.jpg

metadata-files:
  - classlib/classlib/quarto/metadata/hickernell-texts.yml

# Navigation remains course-specific here. Shared layout and typography come
# from classlib through the page metadata and project-level stylesheet.
website:
