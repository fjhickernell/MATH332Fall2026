# Collaborator reference catalog (schema version 1).
# Names and stable IDs only; not an exhaustive historical collaborator list.
# Sources: existing MCQMC26 roster and StrategicSamplingColloquium portraits,
# reconciled November 14, 2026. Existing person slugs are preserved as IDs.
#
# Each collaborators.<id>.name is a display name. Keep IDs stable when a name
# changes. Do not add contact details, roles, or portrait rights by inference.
# This file is not loaded automatically and supplies no default talk roster.
# Each consumer must explicitly select its own ordered list of IDs; adding a
# catalog entry must never add a person to an existing talk automatically.
# Example consumer selection: collaborator_ids: [choi-sou-cheng, millet-megan]
# Portraits and rendering are deliberately outside this names-only catalog.

