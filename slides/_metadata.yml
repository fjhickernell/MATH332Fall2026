metadata-files:
  - ../course-metadata.yml
  - ../classlib/classlib/quarto/slides/hickernell-slides.yml

course_title: "MATH 332 — Fall 2026"
author: "Fred J. Hickernell"
date: today
date-format: "MMMM D, YYYY"
course_website: https://fjhickernell.github.io/MATH332Fall2026/

decks:
  d00:
    file: 00-why-linear-algebra.html
    title: Why Linear Algebra?
    short_title: Why Linear Algebra?
  d01:
    file: 01-systems-and-matrices.html
    title: Systems of Linear Equations and Matrices
    short_title: Systems and Matrices
  d02:
    file: 02-inverses-and-invertibility.html
    title: Inverses and Invertibility
    short_title: Inverses
  d03:
    file: 03-matrix-structure-and-transformations.html
    title: Matrix Structure and Transformations
    short_title: Matrix Transformations
  d04:
    file: 04-determinants.html
    title: Determinants
    short_title: Determinants
  d05:
    file: 05-euclidean-vector-spaces.html
    title: Euclidean Vector Spaces
    short_title: Euclidean Spaces
  d06:
    file: 06-general-vector-spaces.html
    title: Vector Spaces, Subspaces, and Span
    short_title: Vector Spaces and Span
    anton_sections: "§§4.1–4.3"
  d07:
    file: 07-bases-dimension-and-coordinates.html
    title: Bases, Dimension, and Coordinates
    short_title: Bases and Coordinates
    anton_sections: "§§4.4–4.7"
  d08:
    file: 08-matrix-spaces-and-rank.html
    title: Matrix Spaces and Rank
    short_title: Matrix Spaces and Rank
    anton_sections: "§§4.8–4.9"
  d09:
    file: 09-eigenvalues-and-eigenvectors.html
    title: Eigenvalues and Eigenvectors
    short_title: Eigenvalues
  d10:
    file: 10-inner-product-spaces.html
    title: Inner Product Spaces
    short_title: Inner Products

  d11:
    file: 11-special-topics.html
    title: Special Topics
    short_title: Special Topics

format:
  revealjs:
    navigation-mode: grid
    controls: true
    theme:
      - simple
      - ../classlib/classlib/quarto/slides/hickernell-slides.scss
      - math332-slides.scss
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js
execute:
  warning: false
  message: false
  freeze: false
  fig-path: "{basename}_files/figure-revealjs/"
